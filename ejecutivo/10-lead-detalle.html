<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CRM Extrucol · Ejecutivo · Detalle Lead + Conversión</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/components.css">
<style>
  .canvas-title { font: 800 22px 'Roboto'; color: #1A1A1A; margin-bottom: 6px; }
  .canvas-subtitle { font: 400 14px 'Roboto'; color: #6B6B6B; margin-bottom: 24px; }
  .canvas-section-title { font: 700 15px 'Roboto'; color: #24388C; margin: 40px 0 20px; padding: 8px 14px; background: #fff; border: 1px solid #E5E5E5; border-radius: 6px; display: inline-block; }

  .modal-overlay {
    position: absolute; inset: 0;
    background: rgba(26,26,26,0.5);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 60px 24px;
    z-index: 100;
  }
  .modal-content {
    background: var(--surface);
    border-radius: 12px;
    max-width: 560px; width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    overflow: hidden;
  }
  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-header__icon {
    width: 40px; height: 40px;
    background: var(--success-bg); color: var(--success);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    margin-right: 12px;
  }
  .modal-body { padding: 20px 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; background: var(--page-bg); }

  .convert-preview {
    background: var(--page-bg);
    border: 1px dashed var(--primary);
    border-radius: 8px;
    padding: 14px;
    margin-top: 12px;
  }
  .convert-arrow {
    display: flex; align-items: center; justify-content: center;
    padding: 12px;
    color: var(--primary);
  }
  .convert-arrow svg { width: 24px; height: 24px; }
</style>
</head>
<body>
<div style="display: flex; justify-content: center; background: #F4F4F5; padding: 40px;">
  <div class="canvas" style="width: 1440px;">
    <div class="app-shell" id="shell"></div>
  </div>
</div>

<script src="../shared/components.js"></script>
<script>
function detailContent() {
  const header = `
    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px;">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">
        <a style="color: var(--primary); cursor: pointer;">Leads</a>
        <span>/</span>
        <span>LEAD-2026-0234</span>
      </div>
      <div style="display: flex; justify-content: space-between; gap: 16px;">
        <div style="flex: 1;">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;">
            <span class="badge badge--calificacion"><span class="dot"></span> Interesado</span>
            <span class="badge badge--info">${Icons.globe.replace('class="icon"','class="icon icon--xs"')} Página Web</span>
            <span class="badge badge--accent">${Icons.fire.replace('class="icon"','class="icon icon--xs"')} Score 86</span>
          </div>
          <div style="font-size: 22px; font-weight: 800; color: var(--text-primary); line-height: 1.2;">
            Suministro anual de tubería
          </div>
          <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
            Constructora Bolívar · Recibido hace 7 días
          </div>
        </div>
        <div style="display: flex; gap: 8px; flex-shrink: 0;">
          <a href="https://ejemplo.com" style="text-decoration: none; color: inherit; font: inherit; cursor: pointer;">
            <button class="btn btn--secondary btn--sm">${Icons.pencil} Editar</button>
          </a>
          <a href="https://ejemplo.com" style="text-decoration: none; color: inherit; font: inherit; cursor: pointer;">
            <button class="btn btn--secondary btn--sm">${Icons.xCircle} Descalificar</button>
          </a>
          <a href="16-lead-conversion.html" style="text-decoration: none; color: inherit; font: inherit; cursor: pointer;">
            <button class="btn btn--primary btn--sm" style="background: var(--success);">${Icons.arrowRight} Convertir a oportunidad</button>
          </a>
        </div>
      </div>
    </div>
  `;

  const interesesHTML = `
    <div class="card">
      <div class="card__header">
        <div class="card__title">Intereses del lead</div>
        <span class="badge badge--info">3 seleccionados</span>
      </div>
      <div class="card__body" style="display: flex; flex-wrap: wrap; gap: 8px;">
        <span class="badge badge--info" style="padding: 6px 12px;">${Icons.tag.replace('class="icon"','class="icon icon--xs"')} Tubería PE100</span>
        <span class="badge badge--info" style="padding: 6px 12px;">${Icons.tag.replace('class="icon"','class="icon icon--xs"')} Accesorios PE</span>
        <span class="badge badge--info" style="padding: 6px 12px;">${Icons.tag.replace('class="icon"','class="icon icon--xs"')} Asesoría técnica</span>
      </div>
    </div>
  `;

  const historialHTML = `
    <div class="card">
      <div class="card__header">
        <div class="card__title">Historial de estados</div>
      </div>
      <div class="card__body">
        <div class="timeline">
          <div class="timeline__item">
            <div class="timeline__dot"></div>
            <div class="timeline__header">
              <div class="timeline__title">Interesado</div>
              <span class="timeline__date">Hoy</span>
            </div>
            <div class="timeline__desc">Acordó reunión técnica para definir volúmenes</div>
          </div>
          <div class="timeline__item">
            <div class="timeline__dot timeline__dot--muted"></div>
            <div class="timeline__header">
              <div class="timeline__title">Contactado</div>
              <span class="timeline__date">Hace 3 días</span>
            </div>
            <div class="timeline__desc">Primera llamada con el departamento de compras</div>
          </div>
          <div class="timeline__item">
            <div class="timeline__dot timeline__dot--muted"></div>
            <div class="timeline__header">
              <div class="timeline__title">Nuevo</div>
              <span class="timeline__date">Hace 7 días</span>
            </div>
            <div class="timeline__desc">Lead creado desde formulario web</div>
          </div>
        </div>
      </div>
    </div>
  `;

  const sidePanel = `
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div class="card">
        <div class="card__header"><div class="card__title">Contacto</div></div>
        <div class="card__body">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
            <div class="avatar avatar--color-2">PB</div>
            <div>
              <div style="font-weight: 700;">Pedro Bolívar</div>
              <div style="font-size: 12px; color: var(--text-muted);">Gerente de Compras</div>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px;">
            <a style="color: var(--primary); display: flex; align-items: center; gap: 6px; cursor: pointer;">${Icons.phone} +57 315 789 0123</a>
            <a style="color: var(--primary); display: flex; align-items: center; gap: 6px; cursor: pointer;">${Icons.envelope} p.bolivar@cbolivar.co</a>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card__header"><div class="card__title">Información</div></div>
        <div class="card__body">
          <dl class="detail-info-list">
            <dt>Origen</dt><dd>Página Web</dd>
            <dt>Empresa</dt><dd>Constructora Bolívar</dd>
            <dt>Ejecutivo</dt><dd>Juan Pérez</dd>
            <dt>Score</dt><dd style="color: var(--accent); font-weight: 700;">86 / 100</dd>
            <dt>Edad</dt><dd>7 días</dd>
            <dt>Próximo seguim.</dt><dd>Mañana 10am</dd>
          </dl>
        </div>
      </div>

      <div class="card">
        <div class="card__header"><div class="card__title">Acciones</div></div>
        <div class="card__body" style="display: flex; flex-direction: column; gap: 8px;">
            <a href="16-lead-conversion.html" style="text-decoration: none; color: inherit; font: inherit; cursor: pointer;">
              <button class="btn btn--primary btn--sm" style="background: var(--success); width: 100%;">${Icons.arrowRight} Convertir a oportunidad</button>
            </a>
          <button class="btn btn--secondary btn--block">${Icons.arrowRight} Trasladar a distribuidor</button>
          <button class="btn btn--secondary btn--block" style="color: var(--error); border-color: var(--error-border);">${Icons.xCircle} Descalificar lead</button>
        </div>
      </div>
    </div>
  `;

  const actividadesHTML = `
    <div class="card">
      <div class="card__header">
        <div>
          <div class="card__title">Actividades</div>
          <div class="card__subtitle">3 registradas</div>
        </div>
        <button class="btn btn--ghost btn--sm">${Icons.plus}</button>
      </div>
      <div class="card__body">
        <div class="timeline">
          <div class="timeline__item">
            <div class="timeline__dot timeline__dot--success"></div>
            <div class="timeline__header">
              <div class="timeline__title">Llamada de seguimiento</div>
              <span class="timeline__date">Hoy, 10am</span>
            </div>
            <div class="timeline__desc">Cliente confirmó interés en visita técnica</div>
            <div style="display: flex; gap: 6px; margin-top: 6px;">
              <span class="badge badge--neutral">${Icons.phone.replace('class="icon"','class="icon icon--xs"')} Llamada</span>
              <span class="badge badge--ganada"><span class="dot"></span> Completada</span>
            </div>
          </div>
          <div class="timeline__item">
            <div class="timeline__dot timeline__dot--success"></div>
            <div class="timeline__header">
              <div class="timeline__title">Email - envío de portafolio</div>
              <span class="timeline__date">Hace 5 días</span>
            </div>
            <div class="timeline__desc">Envío de catálogo técnico de tubería PE100</div>
          </div>
          <div class="timeline__item">
            <div class="timeline__dot"></div>
            <div class="timeline__header">
              <div class="timeline__title">Primer contacto web</div>
              <span class="timeline__date">Hace 7 días</span>
            </div>
            <div class="timeline__desc">Formulario de contacto en página web</div>
          </div>
        </div>
      </div>
    </div>
  `;

  return `
    <div class="content">
      ${header}
      <div style="display: grid; gap: 16px; grid-template-columns: 1fr 320px;">
        <div style="display: flex; flex-direction: column; gap: 16px; min-width: 0;">
          ${interesesHTML}
          ${actividadesHTML}
          ${historialHTML}
        </div>
        ${sidePanel}
      </div>
    </div>
  `;
}

document.getElementById('shell').innerHTML = `${renderSidebar('leads','ejecutivo')}<div class="main-area">${renderTopbar({breadcrumb:['Leads','Detalle']})}${detailContent()}</div>`;
</script>
</body>
</html>
